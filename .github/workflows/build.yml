name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Make icon
        run: python -c "from bensvoice.app import icon_image; icon_image('ready').save('icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64)])"

      - name: Build exe
        run: pyinstaller --noconfirm --windowed --name BensVoice --icon icon.ico --collect-all onnx_asr --hidden-import pystray._win32 run.py

      - name: Self-test the packaged app
        shell: pwsh
        run: |
          $p = Start-Process dist\BensVoice\BensVoice.exe -ArgumentList "--selftest", "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Transcribe a spoken sample with the packaged app
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $s.SetOutputToWaveFile("$PWD\sample.wav")
          $s.Speak("Hello from Windows. Let's meet on Thursday at three.")
          $s.Dispose()
          $p = Start-Process dist\BensVoice\BensVoice.exe -ArgumentList "--transcribe", "$PWD\sample.wav", "$PWD\transcript.txt" -Wait -PassThru
          Get-Content transcript.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Path transcript.txt -Pattern "Thursday" -Quiet)) { exit 1 }

      - name: Run the real app and measure idle memory and CPU
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:APPDATA\BensVoice" | Out-Null
          '{ "keepModelLoadedMinutes": 0.25 }' | Set-Content "$env:APPDATA\BensVoice\config.json"
          Start-Process dist\BensVoice\BensVoice.exe
          Start-Sleep 12
          $loaded = Get-Process BensVoice
          "while model loaded: $($loaded.Count) processes, " + (($loaded | ForEach-Object { "{0:N0} MB" -f ($_.WorkingSet64 / 1MB) }) -join " + ")
          Start-Sleep 30
          $p = Get-Process BensVoice
          $cpu0 = ($p | Measure-Object CPU -Sum).Sum
          Start-Sleep 30
          $p = Get-Process BensVoice
          $cpu = ($p | Measure-Object CPU -Sum).Sum - $cpu0
          $mb = ($p | Measure-Object WorkingSet64 -Sum).Sum / 1MB
          "after idle unload: $($p.Count) process, {0:N0} MB, {1:N2} s CPU over 30 s" -f $mb, $cpu
          Get-Content "$env:APPDATA\BensVoice\bensvoice.log"
          Stop-Process -Name BensVoice
          Remove-Item "$env:APPDATA\BensVoice\config.json"
          if ($loaded.Count -ne 2 -or $p.Count -ne 1 -or $mb -gt 150 -or $cpu -gt 0.5) { exit 1 }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\BensVoice -DestinationPath BensVoice-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BensVoice-Windows
          path: BensVoice-Windows.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BensVoice-Windows.zip
